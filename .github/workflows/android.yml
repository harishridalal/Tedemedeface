name: Build Face Filter APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract v5 source ZIP and verify matching files
        shell: bash
        run: |
          set -euxo pipefail
          test -f FaceFilterOffline_v5.zip
          rm -rf project
          mkdir -p project
          unzip -oq FaceFilterOffline_v5.zip -d project
          test -f project/settings.gradle
          test -f project/app/build.gradle
          grep -n 'overlay.applyFilter(filter)' project/app/src/main/java/com/prateek/offlinefilters/MainActivity.kt
          grep -n 'fun applyFilter(filter: Filter)' project/app/src/main/java/com/prateek/offlinefilters/FilterOverlayView.kt

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Android SDK packages
        shell: bash
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Download MediaPipe face landmark model
        run: |
          mkdir -p project/app/src/main/assets
          curl -L --fail --retry 3 \
            "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task" \
            -o project/app/src/main/assets/face_landmarker.task
          test -s project/app/src/main/assets/face_landmarker.task

      - name: Debug actual Kotlin source
        working-directory: project
        shell: bash
        run: |
          set -euxo pipefail
          echo "=== Repository commit ==="
          git -C .. rev-parse HEAD
          echo "=== MainActivity.kt: overlay declaration and method call ==="
          grep -n -E 'FilterOverlayView|applyFilter' app/src/main/java/com/prateek/offlinefilters/MainActivity.kt
          echo "=== FilterOverlayView.kt: class and filter methods ==="
          grep -n -E 'class FilterOverlayView|fun applyFilter|selectedFilter' app/src/main/java/com/prateek/offlinefilters/FilterOverlayView.kt
          echo "=== All Kotlin definitions of applyFilter ==="
          grep -R -n --include='*.kt' 'fun applyFilter' app/src/main/java || true
          echo "=== Kotlin source files with same package/class names ==="
          grep -R -n --include='*.kt' -E '^package com\\.prateek\\.offlinefilters|class FilterOverlayView' app/src/main/java || true

      - name: Build debug APK
        working-directory: project
        run: gradle --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FaceFilterOffline-debug-apk
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
