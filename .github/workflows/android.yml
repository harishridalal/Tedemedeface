name: Build Face Filter APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare project from uploaded ZIP
        run: |
          test -f FaceFilterOffline_Expanded.zip
          mkdir -p project
          unzip -oq FaceFilterOffline_Expanded.zip -d project
          test -f project/settings.gradle
          test -f project/app/build.gradle

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-35
            build-tools;35.0.0

      - name: Download MediaPipe face landmark model
        run: |
          mkdir -p project/app/src/main/assets
          curl -L --fail --retry 3 \
            "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task" \
            -o project/app/src/main/assets/face_landmarker.task
          test -s project/app/src/main/assets/face_landmarker.task

      - name: Build debug APK
        working-directory: project
        run: gradle --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FaceFilterOffline-debug-apk
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
