name: Build Face Filter APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract v7 source ZIP and verify matching files
        shell: bash
        run: |
          set -euxo pipefail
          test -f FaceFilterOffline_v7.zip
          rm -rf project
          mkdir -p project
          unzip -oq FaceFilterOffline_v7.zip -d project
          test -f project/settings.gradle
          test -f project/app/build.gradle
          test -f project/app/src/main/java/com/prateek/offlinefilters/MainActivity.kt
          test -f project/app/src/main/java/com/prateek/offlinefilters/FaceFilterOverlayView.kt
          grep -n 'overlay.applyFilter(filter)' project/app/src/main/java/com/prateek/offlinefilters/MainActivity.kt
          grep -n 'fun applyFilter(filter: Filter)' project/app/src/main/java/com/prateek/offlinefilters/FaceFilterOverlayView.kt
          echo '=== All overlay class definitions across app source sets ==='
          grep -R -n --include='*.kt' -E 'class (FaceFilterOverlayView|FilterOverlayView)' project/app/src || true
          echo '=== All applyFilter definitions across app source sets ==='
          grep -R -n --include='*.kt' 'fun applyFilter' project/app/src || true
          echo '=== Kotlin source files ==='
          find project/app/src -type f -name '*.kt' -print

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Android SDK packages
        shell: bash
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Download MediaPipe face landmark model
        run: |
          mkdir -p project/app/src/main/assets
          curl -L --fail --retry 3 \
            "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task" \
            -o project/app/src/main/assets/face_landmarker.task
          test -s project/app/src/main/assets/face_landmarker.task

      - name: Debug actual Kotlin source
        working-directory: project
        shell: bash
        run: |
          set -euxo pipefail
          echo "=== MainActivity.kt ==="
          sed -n '30,100p' app/src/main/java/com/prateek/offlinefilters/MainActivity.kt
          echo "=== FaceFilterOverlayView.kt ==="
          sed -n '1,45p' app/src/main/java/com/prateek/offlinefilters/FaceFilterOverlayView.kt
          echo "=== Gradle source configuration ==="
          sed -n '1,240p' app/build.gradle
          echo "=== All source files under app/src ==="
          find app/src -type f | sort

      - name: Build debug APK
        working-directory: project
        run: gradle --no-daemon assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FaceFilterOffline-debug-apk
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
